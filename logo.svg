<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76b900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a8c00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0f16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad2)" stroke="url(#grad1)" stroke-width="3"/>
  
  <!-- Plate/Circle -->
  <circle cx="100" cy="105" r="55" fill="none" stroke="url(#grad1)" stroke-width="4" opacity="0.8"/>
  
  <!-- Fork -->
  <g transform="translate(60, 45) rotate(-30)">
    <rect x="0" y="0" width="4" height="60" fill="url(#grad1)" rx="2"/>
    <rect x="-6" y="0" width="4" height="25" fill="url(#grad1)" rx="2"/>
    <rect x="2" y="0" width="4" height="25" fill="url(#grad1)" rx="2"/>
  </g>
  
  <!-- Knife -->
  <g transform="translate(140, 45) rotate(30)">
    <rect x="0" y="0" width="4" height="60" fill="url(#grad1)" rx="2"/>
    <path d="M 0 0 L 8 15 L 0 25 Z" fill="url(#grad1)"/>
  </g>
  
  <!-- AI Brain Symbol -->
  <g transform="translate(100, 80)">
    <!-- Brain outline -->
    <ellipse cx="0" cy="0" rx="25" ry="20" fill="none" stroke="url(#grad1)" stroke-width="2"/>
    <!-- Neural connections -->
    <circle cx="-15" cy="-5" r="3" fill="url(#grad1)"/>
    <circle cx="0" cy="-10" r="3" fill="url(#grad1)"/>
    <circle cx="15" cy="-5" r="3" fill="url(#grad1)"/>
    <circle cx="-10" cy="8" r="3" fill="url(#grad1)"/>
    <circle cx="10" cy="8" r="3" fill="url(#grad1)"/>
    <!-- Connection lines -->
    <line x1="-15" y1="-5" x2="0" y2="-10" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="0" y1="-10" x2="15" y2="-5" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="-15" y1="-5" x2="-10" y2="8" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="15" y1="-5" x2="10" y2="8" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="-10" y1="8" x2="10" y2="8" stroke="url(#grad1)" stroke-width="1.5"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#grad1)" text-anchor="middle" letter-spacing="2">NUTRIGENIUS</text>
  
  <!-- Subtitle -->
  <text x="100" y="172" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" letter-spacing="3" opacity="0.7">AI NUTRITION</text>
</svg>